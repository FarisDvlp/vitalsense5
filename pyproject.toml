[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalsense5"
version = "0.1.0"
description = "VitalSense5 PyQt6 ICU-style PPG monitor frontend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.10",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vitalsense5 = "vitalsense5.main:main"

[tool.setuptools.packages.find]
where = ["src"]
# Note: Bundled fonts/icons remain at repository-root `assets/` per PROJECT.md layout.
# Editable installs (`pip install -e .`, requiring `setuptools`) and repo-root runs
# (`PYTHONPATH=src`) resolve `assets/` automatically; non-editable installs should set
# `VITALSENSE5_ASSETS_DIR` to the `assets/` directory path.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
